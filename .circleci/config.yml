version: 2.1

executors:
  default:
    docker:
      - image: node:18

jobs:
  run-mabl-tests:
    executor: default
    steps:
      - checkout

      - run:
          name: Install Node.js dependencies
          command: npm install

      - run:
          name: Run Mabl Tests via npx GitHub Action
          command: |
            npm install -g @actions/core @actions/github
            npx mablhq/github-run-tests-action \
              --plan-labels ci-cd \
              --application-id v8shDDOplBma19VTUWEkQA-a \
              --environment-id BbKahcHZaXCxvaDwV97Ugg-e \
              --api-key $MABL_API_KEY

workflows:
  run-tests:
    jobs:
      - run-mabl-tests
